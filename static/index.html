<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seat 25 Forms Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-6 space-y-6">
    <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold text-indigo-400">Seat 25: Forms Agent</h1>
        <p class="text-xs text-slate-400">Autonomous UC-01 Supplier Onboarding Intake & Activation</p>
      </div>
      <div id="statusBadge" class="px-3 py-1 bg-slate-800 rounded text-xs">Checking...</div>
    </header>

    <div class="flex flex-wrap gap-2 text-xs">
      <button onclick="setPrompt('Build and publish our supplier onboarding form with compliance consent.')" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 rounded border border-slate-700">📋 UC-01: Build Form</button>
      <button onclick="pollChat()" class="px-3 py-1 bg-indigo-900 hover:bg-indigo-800 rounded border border-indigo-700">💬 Poll UI Chatbot</button>
      <button onclick="setPrompt('Retrieve salary slips for pty_vnd_987654.')" class="px-3 py-1 bg-rose-950 hover:bg-rose-900 text-rose-300 rounded border border-rose-800">🛑 Test Boundary Refusal</button>
    </div>

    <div class="bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-3">
      <label class="block text-xs font-semibold text-slate-300">Natural Language Ask</label>
      <div class="flex gap-2">
        <input id="promptInput" type="text" class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white" value="Build and publish our supplier onboarding form with compliance consent.">
        <button id="runBtn" onclick="runPrompt()" class="bg-indigo-600 hover:bg-indigo-500 font-medium px-4 py-2 rounded text-sm">Execute</button>
      </div>
    </div>

    <div id="graphCard" class="hidden bg-slate-800 p-4 rounded-lg border border-slate-700 space-y-2">
      <h3 class="text-xs font-semibold text-slate-300">Task Execution Graph</h3>
      <div id="nodeGrid" class="grid grid-cols-1 sm:grid-cols-5 gap-2 text-xs"></div>
    </div>

    <div id="resultCard" class="hidden bg-slate-800 p-5 rounded-lg border border-slate-700 space-y-3">
      <div class="flex justify-between items-center">
        <h3 id="resultTitle" class="font-bold text-base"></h3>
        <span id="resultType" class="text-xs px-2 py-0.5 rounded bg-slate-700"></span>
      </div>
      <p id="resultReply" class="text-sm text-slate-200"></p>
      <div id="uiLinkBox" class="hidden p-2 bg-slate-900 rounded border border-slate-700 flex justify-between text-xs">
        <span class="text-slate-400">AgentSwitch Form URL:</span>
        <a id="uiLink" href="#" target="_blank" class="text-indigo-400 font-mono"></a>
      </div>
      <pre id="rawLog" class="p-3 bg-slate-950 font-mono text-xs rounded text-slate-300 overflow-x-auto max-h-48"></pre>
    </div>
  </div>

  <script>
    fetch('/api/health').then(r=>r.json()).then(d=>{
      document.getElementById('statusBadge').textContent = d.live_platform ? 'Live Platform' : 'Offline / Mock Mode';
    }).catch(()=>{document.getElementById('statusBadge').textContent = 'Server Offline';});

    function setPrompt(txt) { document.getElementById('promptInput').value = txt; }

    async function runPrompt() {
      const p = document.getElementById('promptInput').value.trim();
      if (!p) return;
      document.getElementById('runBtn').textContent = 'Running...';
      try {
        const res = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt: p})});
        display(await res.json());
      } catch(e) { alert(e); }
      finally { document.getElementById('runBtn').textContent = 'Execute'; }
    }

    async function pollChat() {
      const res = await fetch('/api/chat/poll', {method:'POST'});
      const d = await res.json();
      if (d.found) display(d.data); else alert(d.message);
    }

    function display(d) {
      document.getElementById('resultCard').classList.remove('hidden');
      document.getElementById('resultTitle').textContent = d.is_refusal ? 'Boundary Refusal' : (d.success ? 'Success' : 'Failed');
      document.getElementById('resultTitle').className = d.is_refusal ? 'font-bold text-amber-400' : (d.success ? 'font-bold text-emerald-400' : 'font-bold text-rose-400');
      document.getElementById('resultType').textContent = d.is_refusal ? 'Refusal' : 'UC-01 Workflow';
      document.getElementById('resultReply').textContent = d.reply;

      if (d.ui_link && !d.is_refusal) {
        document.getElementById('uiLinkBox').classList.remove('hidden');
        document.getElementById('uiLink').href = d.ui_link;
        document.getElementById('uiLink').textContent = d.ui_link;
      } else {
        document.getElementById('uiLinkBox').classList.add('hidden');
      }

      const gCard = document.getElementById('graphCard');
      const gGrid = document.getElementById('nodeGrid');
      gGrid.innerHTML = '';
      if (d.nodes && d.nodes.length) {
        gCard.classList.remove('hidden');
        d.nodes.forEach(n => {
          const col = n.state === 'success' ? 'border-emerald-600 bg-emerald-950/40 text-emerald-200' : 'border-slate-700 bg-slate-900';
          gGrid.innerHTML += `<div class="p-2 rounded border ${col}"><div class="font-bold">${n.id}</div><div class="text-[10px] text-slate-400">${n.tool}</div><div class="text-[9px] uppercase font-semibold">${n.state}</div></div>`;
        });
      } else { gCard.classList.add('hidden'); }
      document.getElementById('rawLog').textContent = JSON.stringify(d, null, 2);
    }
  </script>
</body>
</html>
