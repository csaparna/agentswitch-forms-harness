[project]
name = "agentswitch-forms-harness"
version = "0.1.0"
description = "AgentSwitch Forms Agent (Seat 25) Harness and Evaluation Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40,<2",
    "requests>=2.31,<3",
    "jsonschema>=4.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
